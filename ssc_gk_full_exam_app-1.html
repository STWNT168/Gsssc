<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SSC GK Register — PYQ Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171c2a;
    --ink-2:#20283c;
    --ink-3:#2a3450;
    --paper:#eef1f5;
    --paper-dim:#aab2c5;
    --brass:#d4a24c;
    --brass-dim:#8c723a;
    --sage:#4f9d69;
    --coral:#e2574c;
    --line:rgba(238,241,245,0.10);
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #26304a 0%, var(--ink) 55%);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:84px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 8px;}

  /* Header / ledger tab */
  .masthead{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:6px 2px 16px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .masthead h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.2px;
    margin:0;
    color:var(--paper);
  }
  .masthead .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--brass);
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  .masthead-sub{font-size:11px;color:var(--paper-dim);font-family:'JetBrains Mono',monospace;margin-top:2px;}

  /* Overall stat strip */
  .stat-strip{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;
  }
  .stat-card{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 10px;
    text-align:center;
  }
  .stat-card .num{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;font-size:20px;color:var(--brass);
    display:block;
  }
  .stat-card .lbl{font-size:10px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px;display:block;}

  /* Section list = ledger rows */
  .section-list{display:flex;flex-direction:column;gap:8px;}
  .section-row{
    display:flex;align-items:center;gap:12px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-left:3px solid var(--brass-dim);
    border-radius:8px;
    padding:12px 14px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .section-row:active{transform:scale(0.985);}
  .section-row.complete{border-left-color:var(--sage);}
  .section-row .idx{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--paper-dim);width:20px;flex-shrink:0;
  }
  .section-row .info{flex:1;min-width:0;}
  .section-row .name{font-weight:600;font-size:14.5px;color:var(--paper);}
  .section-row .bar-track{
    height:4px;background:var(--ink-3);border-radius:2px;margin-top:7px;overflow:hidden;
  }
  .section-row .bar-fill{height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass));}
  .section-row .meta{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--paper-dim);
    display:flex;justify-content:space-between;margin-top:5px;
  }
  .section-row .chev{color:var(--paper-dim);font-size:16px;}

  /* Bottom nav */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(23,28,42,0.92);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;justify-content:center;
    z-index:50;
  }
  .bottom-nav .inner{
    max-width:560px;width:100%;
    display:grid;grid-template-columns:1fr 1fr 1fr;
  }
  .nav-btn{
    background:none;border:none;color:var(--paper-dim);
    font-family:'Inter',sans-serif;font-size:11px;font-weight:600;
    padding:12px 4px 10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    letter-spacing:0.3px;
  }
  .nav-btn .ic{font-size:18px;line-height:1;}
  .nav-btn.active{color:var(--brass);}

  /* Quiz screen */
  .quiz-header{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
  }
  .back-btn{
    background:var(--ink-2);border:1px solid var(--line);color:var(--paper);
    border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .streak-pill{
    display:flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,#3a2c14,#241a0c);
    border:1px solid var(--brass-dim);
    padding:6px 12px;border-radius:20px;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--brass);
  }
  .streak-pill.hot{box-shadow:0 0 14px rgba(212,162,76,0.45);}

  .progress-track{
    display:flex;gap:3px;margin-bottom:18px;
  }
  .progress-seg{flex:1;height:5px;border-radius:3px;background:var(--ink-3);}
  .progress-seg.done{background:var(--brass);}
  .progress-seg.correct{background:var(--sage);}
  .progress-seg.wrong{background:var(--coral);}

  .section-label{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--brass);
    text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;
  }
  .q-card{
    background:var(--ink-2);border:1px solid var(--line);border-radius:14px;
    padding:20px 18px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .q-num{font-family:'JetBrains Mono',monospace;color:var(--paper-dim);font-size:12px;margin-bottom:8px;}
  .q-text{font-family:'Fraunces',serif;font-size:18px;line-height:1.45;font-weight:500;color:var(--paper);}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;align-items:center;gap:12px;
    background:var(--ink-2);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;font-size:14.5px;color:var(--paper);
    transition:border-color .15s ease, background .15s ease;
  }
  .opt:active{transform:scale(0.99);}
  .opt .bubble{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;
    border:2px solid var(--paper-dim);
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--paper-dim);
    transition:all .15s ease;
  }
  .opt .txt{flex:1;line-height:1.4;}
  .opt.selected .bubble{border-color:var(--brass);color:var(--brass);}
  .opt.correct{border-color:var(--sage);background:rgba(79,157,105,0.12);}
  .opt.correct .bubble{background:var(--sage);border-color:var(--sage);color:#0d1710;}
  .opt.wrong{border-color:var(--coral);background:rgba(226,87,76,0.12);}
  .opt.wrong .bubble{background:var(--coral);border-color:var(--coral);color:#280907;}
  .opt.disabled{cursor:default;}

  .feedback{
    margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;
    padding:10px 12px;border-radius:8px;display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{background:rgba(79,157,105,0.15);color:#8fd3a4;border:1px solid rgba(79,157,105,0.3);}
  .feedback.bad{background:rgba(226,87,76,0.15);color:#f0a29c;border:1px solid rgba(226,87,76,0.3);}

  .next-btn{
    width:100%;margin-top:16px;padding:14px;border-radius:12px;border:none;
    background:var(--brass);color:#241a0c;font-weight:700;font-size:15px;
    cursor:pointer;font-family:'Inter',sans-serif;display:none;
  }
  .next-btn.show{display:block;}

  .quiz-tools{
    display:flex;align-items:center;gap:8px;margin-bottom:12px;
  }
  .timer{
    display:flex;align-items:center;gap:7px;
    background:var(--ink-2);border:1px solid var(--line);
    border-radius:10px;padding:8px 11px;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--paper);
  }
  .timer strong{color:var(--brass);min-width:42px;text-align:center;}
  .timer.warning{border-color:var(--coral);}
  .timer-actions{display:flex;gap:6px;margin-left:auto;}
  .timer-actions button{
    background:var(--ink-3);border:1px solid var(--line);color:var(--paper);
    border-radius:7px;padding:6px 8px;font-size:11px;cursor:pointer;
  }
  .difficulty{
    display:inline-flex;align-items:center;
    padding:4px 8px;border-radius:999px;
    font-family:'JetBrains Mono',monospace;font-size:10px;
    text-transform:uppercase;letter-spacing:.7px;
    margin-top:9px;border:1px solid var(--line);
  }
  .difficulty.easy{color:#9bd8ae;border-color:rgba(79,157,105,.45);background:rgba(79,157,105,.10);}
  .difficulty.moderate{color:var(--brass);border-color:rgba(212,162,76,.45);background:rgba(212,162,76,.10);}
  .difficulty.difficult{color:#f0a29c;border-color:rgba(226,87,76,.45);background:rgba(226,87,76,.10);}
  .quiz-nav{
    display:flex;gap:9px;margin-top:16px;
  }
  .quiz-nav button{
    flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);
    background:var(--ink-3);color:var(--paper);
    font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .quiz-nav button:disabled{opacity:.4;cursor:not-allowed;}
  .quiz-nav .next-nav{background:var(--brass);color:#241a0c;border-color:var(--brass);}
  .revision-tag-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
  .revision-filter{
    background:var(--ink-2);border:1px solid var(--line);color:var(--paper-dim);
    border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer;
  }
  .revision-filter.active{color:var(--brass);border-color:var(--brass-dim);}


  .quiz-settings{
    background:var(--ink-2);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:14px;
  }
  .quiz-settings-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .quiz-settings label{font-size:11px;color:var(--paper-dim);}
  .quiz-settings select,.quiz-settings input{
    background:var(--ink-3);color:var(--paper);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font-size:11px;
  }
  .mode-btn{
    flex:1;background:var(--ink-2);border:1px solid var(--line);color:var(--paper);
    border-radius:10px;padding:10px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .mode-btn.active{color:var(--brass);border-color:var(--brass-dim);}
  .bookmark{
    background:none;border:1px solid var(--line);color:var(--paper-dim);
    border-radius:8px;padding:7px 9px;cursor:pointer;font-size:16px;
  }
  .bookmark.active{color:var(--brass);border-color:var(--brass-dim);}
  .q-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .topic-tag{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;
    color:var(--paper-dim);border:1px solid var(--line);padding:3px 6px;border-radius:999px;
  }
  .explanation{
    margin-top:12px;padding:11px 12px;border-radius:9px;
    background:rgba(212,162,76,.08);border:1px solid rgba(212,162,76,.18);
    color:var(--paper-dim);font-size:12px;line-height:1.5;
  }
  .mini-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
  .mini-stat{background:var(--ink-2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;}
  .mini-stat b{display:block;color:var(--brass);font-family:'JetBrains Mono',monospace;font-size:17px;}
  .mini-stat span{font-size:9px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.7px;}
  .bookmark-list .section-row{border-left-color:var(--brass);}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--paper-dim);
  }
  .empty-state .big{font-family:'Fraunces',serif;font-size:20px;color:var(--paper);margin-bottom:8px;}
  .empty-state .flame{font-size:38px;margin-bottom:14px;}

  .revision-toolbar{
    display:flex;gap:8px;margin-bottom:16px;
  }
  .pill-btn{
    flex:1;background:var(--ink-2);border:1px solid var(--line);color:var(--paper);
    border-radius:10px;padding:10px;font-size:12.5px;text-align:center;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .pill-btn.danger{color:var(--coral);}

  .end-card{
    background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:26px 20px;text-align:center;
  }
  .end-card .score{font-family:'Fraunces',serif;font-size:38px;color:var(--brass);margin:8px 0;}
  .end-card .label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:1.5px;}
  .end-actions{display:flex;gap:10px;margin-top:18px;}
  .end-actions button{
    flex:1;padding:12px;border-radius:10px;border:none;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .end-actions .primary{background:var(--brass);color:#241a0c;}
  .end-actions .secondary{background:var(--ink-3);color:var(--paper);}

  ::selection{background:var(--brass);color:#241a0c;}
  a{color:var(--brass);}
</style>

<style id="ssc-exam-style">
.exam-launch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}
.exam-control{background:rgba(255,255,255,.035);border:1px solid rgba(212,175,55,.22);border-radius:14px;padding:14px}
.exam-control label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.exam-control select,.exam-control input{width:100%;box-sizing:border-box;background:#111;border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:10px}
.exam-btn{width:100%;border:0;border-radius:11px;padding:11px 12px;background:linear-gradient(135deg,#c9a227,#8f7113);color:#17130a;font-weight:800;cursor:pointer}
.exam-btn.secondary{background:rgba(255,255,255,.07);color:#eee;border:1px solid rgba(255,255,255,.12)}
.exam-palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:12px 0}
.palette-btn{aspect-ratio:1;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:#202020;color:#ddd;font-weight:700;cursor:pointer}
.palette-btn.answered{background:#214c31;border-color:#3e8d59}
.palette-btn.marked{box-shadow:inset 0 0 0 2px #d6b33d}
.palette-btn.current{outline:2px solid #fff}
.palette-btn.unanswered{background:#242424}
.exam-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.exam-clock{font-variant-numeric:tabular-nums;font-weight:900;font-size:18px;color:#f4d477}
.exam-actions{display:flex;gap:8px;flex-wrap:wrap}
.exam-actions button{border:0;border-radius:9px;padding:9px 11px;cursor:pointer;background:rgba(255,255,255,.08);color:#fff}
.exam-qmeta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.exam-chip{font-size:11px;padding:4px 8px;border-radius:999px;background:rgba(212,175,55,.13);border:1px solid rgba(212,175,55,.24);color:#ead27c}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.result-stat{padding:14px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.result-stat b{display:block;font-size:22px;margin-top:4px}
.perf-row{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;margin:9px 0}
.perf-bar{height:9px;border-radius:99px;background:#222;overflow:hidden}
.perf-fill{height:100%;background:#c9a227}
.weak-list{display:grid;gap:8px;margin-top:10px}
.weak-item{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:rgba(255,255,255,.035);border-radius:10px}
.target-card{padding:14px;border:1px solid rgba(212,175,55,.2);border-radius:14px;background:rgba(212,175,55,.04)}
.target-progress{height:10px;background:#202020;border-radius:99px;overflow:hidden;margin:9px 0}
.target-progress>i{display:block;height:100%;background:#c9a227}
@media(max-width:520px){.exam-palette{grid-template-columns:repeat(6,1fr)}.perf-row{grid-template-columns:80px 1fr 55px}}
</style>

</head>
<body>
<section id="exam-panel" style="display:none">
  <div class="card">
    <div class="exam-top">
      <div>
        <h2 style="margin:0">SSC Mock Test</h2>
        <div class="muted">Exam mode with negative marking, palette navigation and detailed analysis.</div>
      </div>
      <button class="exam-btn secondary" id="exam-exit">Exit</button>
    </div>
    <div id="exam-launch">
      <div class="exam-launch">
        <div class="exam-control"><label>Question Count</label><select id="exam-count"><option>10</option><option>25</option><option>50</option></select></div>
        <div class="exam-control"><label>Subject</label><select id="exam-subject"><option value="all">All Subjects</option></select></div>
        <div class="exam-control"><label>Negative Marking</label><select id="exam-negative"><option value="0.25">0.25 mark</option><option value="0.50">0.50 mark</option><option value="0">None</option></select></div>
        <div class="exam-control"><label>Time</label><select id="exam-time"><option value="10">10 min</option><option value="25">25 min</option><option value="50">50 min</option><option value="60">60 min</option></select></div>
      </div>
      <div style="margin-top:14px"><button class="exam-btn" id="exam-start">Start Mock Test</button></div>
    </div>
    <div id="exam-running" style="display:none">
      <div class="exam-top">
        <div><b id="exam-title">Mock Test</b><div class="muted" id="exam-counter"></div></div>
        <div class="exam-clock" id="exam-clock">00:00</div>
      </div>
      <div class="exam-actions" style="margin-top:10px">
        <button id="exam-mark">☆ Mark for Review</button>
        <button id="exam-clear">Clear Answer</button>
        <button id="exam-submit">Submit Test</button>
      </div>
      <div class="exam-palette" id="exam-palette"></div>
      <div id="exam-question"></div>
      <div class="exam-actions" style="margin-top:14px">
        <button id="exam-prev">← Previous</button>
        <button id="exam-next">Next →</button>
      </div>
    </div>
    <div id="exam-result" style="display:none"></div>
  </div>
</section>

<div class="wrap" id="app"></div>

<div class="bottom-nav">
  <div class="inner">
    <button class="nav-btn active" data-view="home" onclick="goto('home')">
      <span class="ic">&#9776;</span>Sections
    </button>
    <button class="nav-btn" data-view="revision" onclick="goto('revision')">
      <span class="ic">&#9888;</span>Revision
    </button>
    <button class="nav-btn" data-view="stats" onclick="goto('stats')">
      <span class="ic">&#9679;</span>Stats
    </button>
  </div>
</div>

<script src="quiz_data.js"></script>
<script>
/* ---------------- State & persistence ---------------- */
const STORE_KEY = 'sscGkRegisterV1';
let memoryFallback = null;

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  if(memoryFallback) return memoryFallback;
  return { progress:{}, wrongBank:{}, streak:0, bestStreak:0 };
}
function saveStore(s){
  memoryFallback = s;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
}
let store = loadStore();

const SECTIONS = Object.keys(QUIZ_DATA);

function sectionStats(name){
  const qs = QUIZ_DATA[name];
  const prog = store.progress[name] || {};
  let answered = 0, correct = 0;
  qs.forEach((_,i)=>{
    const p = prog[i];
    if(p){ answered++; if(p.correct) correct++; }
  });
  return { total: qs.length, answered, correct };
}

function overallStats(){
  let total=0, answered=0, correct=0;
  SECTIONS.forEach(s=>{
    const st = sectionStats(s);
    total += st.total; answered += st.answered; correct += st.correct;
  });
  let wrongCount = 0;
  Object.values(store.wrongBank).forEach(arr=>{ wrongCount += arr.length; });
  return { total, answered, correct, wrongCount };
}

/* ---------------- Router ---------------- */
let view = 'home';
let activeSection = null;
let activeIndex = 0;
let sessionOrder = [];
let revisionMode = false;
let sessionCorrect = 0, sessionTotal = 0;
let answeredThisQ = false;
let timerLimit = Number(localStorage.getItem('sscTimerLimit') || 30);
let quizHistory = [];
let bookmarks = JSON.parse(localStorage.getItem('sscBookmarksV1') || '{}');
let revisionFilterLevel = 'all';

function saveBookmarks(){
  try{ localStorage.setItem('sscBookmarksV1', JSON.stringify(bookmarks)); }catch(e){}
}
function qKey(sec,i){ return `${sec}::${i}`; }
function isBookmarked(sec,i){ return !!bookmarks[qKey(sec,i)]; }
function toggleBookmark(sec,i){
  const k=qKey(sec,i);
  if(bookmarks[k]) delete bookmarks[k];
  else bookmarks[k]={sec,i};
  saveBookmarks();
  render();
}
function setTimerLimit(v){
  timerLimit = Math.max(10, Math.min(300, Number(v)||30));
  localStorage.setItem('sscTimerLimit', String(timerLimit));
}
function formatDuration(sec){
  sec=Math.max(0,Math.round(sec));
  return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
}
function bookmarkedList(){
  return Object.values(bookmarks).filter(x=>QUIZ_DATA[x.sec] && QUIZ_DATA[x.sec][x.i]);
}
function startCustomRun(level='all'){
  const pool=[];
  SECTIONS.forEach(sec=>{
    QUIZ_DATA[sec].forEach((q,i)=>{
      if(level==='all' || getDifficulty(q)===level) pool.push({sec,i});
    });
  });
  pool.sort(()=>Math.random()-.5);
  if(!pool.length) return;
  revisionMode=false; activeSection=null; sessionOrder=pool.slice(0,Math.min(20,pool.length));
  activeIndex=0; sessionCorrect=0; sessionTotal=0; answeredThisQ=false;
  view='quiz'; render();
}
function startBookmarkRun(){
  const pool=bookmarkedList();
  if(!pool.length) return;
  revisionMode=true; activeSection=null; sessionOrder=pool; activeIndex=0;
  sessionCorrect=0; sessionTotal=0; answeredThisQ=false; view='quiz'; render();
}


let timerSeconds = 30;
let timerId = null;
let timerPaused = false;
const DEFAULT_TIMER_SECONDS = timerLimit;

function getDifficulty(q){
  const raw = String(q.difficulty || q.level || q.tag || '').toLowerCase().trim();
  if(raw.includes('easy') || raw.includes('east')) return 'easy';
  if(raw.includes('difficult') || raw.includes('hard')) return 'difficult';
  return 'moderate';
}
function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
}
function startTimer(){
  stopTimer();
  timerSeconds = timerLimit;
  timerPaused = false;
  updateTimerUI();
  timerId = setInterval(()=>{
    if(timerPaused || answeredThisQ) return;
    timerSeconds--;
    updateTimerUI();
    if(timerSeconds <= 0){
      stopTimer();
      if(!answeredThisQ) timeUp();
    }
  },1000);
}
function toggleTimer(){
  if(answeredThisQ) return;
  timerPaused = !timerPaused;
  updateTimerUI();
}
function resetTimer(){
  if(answeredThisQ) return;
  timerSeconds = timerLimit;
  timerPaused = false;
  updateTimerUI();
}
function updateTimerUI(){
  const el = document.getElementById('timerValue');
  const box = document.getElementById('timerBox');
  if(!el) return;
  const m = Math.floor(Math.max(0,timerSeconds)/60);
  const sec = Math.max(0,timerSeconds)%60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  box.classList.toggle('warning', timerSeconds <= 10);
  const pause = document.getElementById('timerPause');
  if(pause) pause.textContent = timerPaused ? 'Resume' : 'Pause';
}
function timeUp(){
  const {q}=currentQ();
  // Timeout is treated as unanswered/wrong and placed in revision.
  answer('__TIMEOUT__');
}
function previousQ(){
  if(activeIndex <= 0) return;
  stopTimer();
  activeIndex--;
  const {sec,i}=currentQ();
  const p = (store.progress[sec]||{})[i];
  answeredThisQ = !!p;
  render();
}

function goto(v){
  if(v !== 'quiz') stopTimer();
  view = v;
  render();
}

function openSection(name){
  activeSection = name;
  revisionMode = false;
  const prog = store.progress[name] || {};
  // resume: first unanswered, else start over from 0
  let startAt = QUIZ_DATA[name].findIndex((_,i)=> !prog[i]);
  if(startAt === -1) startAt = 0;
  sessionOrder = QUIZ_DATA[name].map((_,i)=>i);
  activeIndex = sessionOrder.indexOf(startAt);
  sessionCorrect = 0; sessionTotal = 0;
  answeredThisQ = false;
  view = 'quiz';
  render();
}

function openRevision(){
  const bank = [];
  Object.keys(store.wrongBank).forEach(sec=>{
    (store.wrongBank[sec]||[]).forEach(i=> bank.push({sec, i}));
  });
  if(bank.length === 0){ view='revision'; render(); return; }
  revisionMode = true;
  activeSection = null;
  sessionOrder = bank;
  activeIndex = 0;
  sessionCorrect = 0; sessionTotal = 0;
  answeredThisQ = false;
  view = 'quiz';
  render();
}

function currentQ(){
  if(revisionMode){
    const ref = sessionOrder[activeIndex];
    return { q: QUIZ_DATA[ref.sec][ref.i], sec: ref.sec, i: ref.i };
  } else {
    const i = sessionOrder[activeIndex];
    return { q: QUIZ_DATA[activeSection][i], sec: activeSection, i };
  }
}

function answer(letter){
  if(answeredThisQ) return;
  answeredThisQ = true;
  const { q, sec, i } = currentQ();
  const timedOut = letter === '__TIMEOUT__';
  const correct = !timedOut && letter === q.answer;
  sessionTotal++;
  if(correct) sessionCorrect++;

  // streak
  if(correct){ store.streak++; if(store.streak > store.bestStreak) store.bestStreak = store.streak; }
  else { store.streak = 0; }

  // progress record
  if(!store.progress[sec]) store.progress[sec] = {};
  const prev = store.progress[sec][i] || {};
  store.progress[sec][i] = {
    correct, last: letter,
    attempts: (prev.attempts||0)+1,
    lastAttemptAt: Date.now()
  };

  // wrong bank maintenance
  if(!store.wrongBank[sec]) store.wrongBank[sec] = [];
  const idx = store.wrongBank[sec].indexOf(i);
  if(correct){
    if(idx !== -1) store.wrongBank[sec].splice(idx,1);
  } else {
    if(idx === -1) store.wrongBank[sec].push(i);
  }
  saveStore(store);
  renderQuizFeedback(letter, correct);
}

function nextQ(){
  if(!answeredThisQ) return;
  stopTimer();
  activeIndex++;
  if(activeIndex >= sessionOrder.length){
    view = 'end';
    render();
    return;
  }
  answeredThisQ = false;
  render();
}

  const list = (store.wrongBank[sec]||[]).map(i=>({sec, i}));
  if(list.length===0) return;
  revisionMode = true;
  activeSection = null;
  sessionOrder = list;
  activeIndex = 0;
  sessionCorrect = 0; sessionTotal = 0;
  answeredThisQ = false;
  view = 'quiz';
  render();
}


function filterRevision(level){
  document.querySelectorAll('.revision-filter').forEach(b=>b.classList.remove('active'));
  const buttons = [...document.querySelectorAll('.revision-filter')];
  const active = buttons.find(b=>b.textContent.toLowerCase().includes(level));
  if(active) active.classList.add('active');

  const list = [];
  Object.keys(store.wrongBank).forEach(sec=>{
    (store.wrongBank[sec]||[]).forEach(i=>{
      const q = QUIZ_DATA[sec][i];
      if(level==='all' || getDifficulty(q)===level) list.push({sec,i});
    });
  });
  const container = document.getElementById('revisionList');
  if(!container) return;
  if(list.length===0){
    container.innerHTML = '<div class="empty-state" style="padding:35px 10px;"><div class="big">No questions in this tag</div><div>Wrong questions remain here until answered correctly.</div></div>';
    return;
  }
  container.innerHTML = list.map(({sec,i})=>{
    const q = QUIZ_DATA[sec][i];
    return `<div class="section-row" onclick="openRevisionSingle('${escAttr(sec)}',${i})">
      <div class="info">
        <div class="name">${esc(q.q)}</div>
        <div class="meta"><span>${esc(sec)}</span><span class="difficulty ${getDifficulty(q)}">${getDifficulty(q)}</span></div>
      </div>
      <div class="chev">&#8250;</div>
    </div>`;
  }).join('');
}

}

function renderQuiz(){
  const { q, sec, i } = currentQ();
  const title = revisionMode ? 'Revision run' : sec;
  const streakClass = store.streak >= 3 ? 'streak-pill hot' : 'streak-pill';
  let segs = '';
  sessionOrder.forEach((_,idx)=>{
    let cls = 'progress-seg';
    if(idx < activeIndex) cls += ' done';
    if(idx === activeIndex) cls += '';
    segs += `<div class="${cls}"></div>`;
  });

  let html = `
    <div class="quiz-header">
      <button class="back-btn" onclick="goto('${revisionMode?'revision':'home'}')">&larr; Back</button>
      <div class="${streakClass}">&#9889; ${store.streak}</div>
    </div>
    <div class="progress-track">${segs}</div>
    <div class="section-label">${esc(title)} &middot; ${activeIndex+1} / ${sessionOrder.length}</div>
    <div class="quiz-tools">
      <div class="timer" id="timerBox">&#9201; <strong id="timerValue">00:30</strong></div>
      <div class="timer-actions">
        <button id="timerPause" onclick="toggleTimer()">Pause</button>
        <button onclick="resetTimer()">Reset</button>
      </div>
    </div>
    <div class="q-card">
      <div class="q-meta">
        <div class="q-num">Q${i+1}</div>
        <button class="bookmark ${isBookmarked(sec,i)?'active':''}" onclick="event.stopPropagation();toggleBookmark('${escAttr(sec)}',${i})">${isBookmarked(sec,i)?'★':'☆'}</button>
      </div>
      <div class="q-text">${esc(q.q)}</div>
      <div class="difficulty ${getDifficulty(q)}">${getDifficulty(q)}</div>
      ${q.topic ? `<span class="topic-tag">${esc(q.topic)}</span>` : ''}
    </div>
    <div class="options" id="opts">
  `;
  ['A','B','C','D'].forEach(letter=>{
    html += `
      <div class="opt" data-letter="${letter}" onclick="answer('${letter}')">
        <div class="bubble">${letter}</div>
        <div class="txt">${esc(q.options[letter])}</div>
      </div>
    `;
  });
  html += `
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="quiz-nav">
      <button id="prevBtn" onclick="previousQ()" ${activeIndex===0?'disabled':''}>&larr; Previous</button>
      <button class="next-nav" id="nextBtn" onclick="nextQ()" ${!answeredThisQ?'disabled':''}>Next &rarr;</button>
    </div>
  `;
  app.innerHTML = html;
  startTimer();
  if(answeredThisQ){
    const p = (store.progress[sec]||{})[i];
    if(p){
      renderQuizFeedback(p.last || '__TIMEOUT__', !!p.correct);
    }
  }
}

function renderQuizFeedback(chosenLetter, correct){
  const { q } = currentQ();
  const timedOut = chosenLetter === '__TIMEOUT__';
  document.querySelectorAll('#opts .opt').forEach(el=>{
    const letter = el.dataset.letter;
    el.classList.add('disabled');
    el.onclick = null;
    if(letter === q.answer) el.classList.add('correct');
    else if(letter === chosenLetter) el.classList.add('wrong');
    if(letter === chosenLetter) el.classList.add('selected');
  });
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  if(correct){
    fb.classList.add('ok');
    fb.textContent = `Correct. Streak: ${store.streak}` + (store.streak===store.bestStreak && store.streak>0 ? ' — new best!' : '');
  } else {
    fb.classList.add('bad');
    fb.textContent = timedOut
      ? `Time up. Correct answer: ${q.answer}) ${q.options[q.answer]}`
      : `Not quite. Correct answer: ${q.answer}) ${q.options[q.answer]}`;
  }
  stopTimer();
  if(q.explanation || q.explain){
    const card=document.querySelector('.q-card');
    const ex=document.createElement('div');
    ex.className='explanation';
    ex.textContent=q.explanation || q.explain;
    card.appendChild(ex);
  }
  document.getElementById('nextBtn').disabled = false;
  document.getElementById('prevBtn').disabled = activeIndex === 0;
}

function renderEnd(){
  const pct = sessionTotal ? Math.round(sessionCorrect/sessionTotal*100) : 0;
  const label = revisionMode ? 'Revision run complete' : 'Section complete';
  app.innerHTML = `
    <div class="masthead">
      <div><h1>Session Done</h1><div class="masthead-sub">${label}</div></div>
      <div class="tag">Result</div>
    </div>
    <div class="end-card">
      <div class="label">Score</div>
      <div class="score">${sessionCorrect}/${sessionTotal}</div>
      <div class="label">${pct}% accuracy this run &middot; current streak ${store.streak}</div>
      <div class="end-actions">
        <button class="secondary" onclick="goto('home')">Sections</button>
        ${revisionMode ? `<button class="primary" onclick="openRevision()">Revise again</button>` : `<button class="primary" onclick="openSection('${escAttr(activeSection)}')">Restart section</button>`}
      </div>
    </div>
  `;
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escAttr(s){ return esc(s).replace(/'/g, "&#39;"); }

render();

<script id="ssc-exam-engine">
(function(){
  const $=id=>document.getElementById(id);
  const KEY='sscExamHistoryV1', TARGET='sscDailyTargetV1';
  const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
  const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  let subjects=[], questions=[], pos=0, remaining=0, timer=null, neg=.25, examStart=0, marked={};

  function allQuestions(){
    const data=window.QUIZ_DATA||{};
    const out=[];
    Object.keys(data).forEach(sec=>{
      (data[sec]||[]).forEach((q,i)=>out.push({q,sec,i}));
    });
    return out;
  }
  function label(x){return x.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
  function esc2(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  function getAnswer(q){return q.answer}
  function optText(q,l){return q.options?.[l] ?? q.options?.[l.toLowerCase()] ?? q[l] ?? l}
  function openPanel(){
    $('exam-panel').style.display='';
    document.querySelectorAll('main > *').forEach(x=>{ if(x.id!=='exam-panel') x.dataset.examHidden=x.style.display; });
    $('exam-launch').style.display='';
    $('exam-running').style.display='none';
    $('exam-result').style.display='none';
    subjects=[...new Set(allQuestions().map(x=>x.sec))];
    $('exam-subject').innerHTML='<option value="all">All Subjects</option>'+subjects.map(s=>'<option value="'+esc2(s)+'">'+esc2(label(s))+'</option>').join('');
    renderTarget();
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function closePanel(){
    $('exam-panel').style.display='none';
    if(timer){clearInterval(timer);timer=null}
  }
  function renderTarget(){
    const d=load(TARGET,{date:new Date().toISOString().slice(0,10),target:25,done:0});
    const today=new Date().toISOString().slice(0,10);
    if(d.date!==today){d.date=today;d.done=0;save(TARGET,d)}
    let box=document.getElementById('exam-target');
    if(!box){box=document.createElement('div');box.id='exam-target';$('exam-launch').appendChild(box)}
    const pct=Math.min(100,Math.round((d.done/Math.max(1,d.target))*100));
    box.innerHTML='<div class="target-card"><b>Daily Target</b><div class="muted">'+d.done+' / '+d.target+' questions completed today</div><div class="target-progress"><i style="width:'+pct+'%"></i></div><div class="exam-actions"><button id="target-minus">−</button><button id="target-plus">+ Set Target</button></div></div>';
    $('target-minus').onclick=()=>{d.target=Math.max(5,d.target-5);save(TARGET,d);renderTarget()};
    $('target-plus').onclick=()=>{d.target=Math.min(200,d.target+5);save(TARGET,d);renderTarget()};
  }
  function start(){
    const count=+$('exam-count').value, subject=$('exam-subject').value;
    neg=+$('exam-negative').value;
    const time=+$('exam-time').value*60;
    let pool=allQuestions().filter(x=>subject==='all'||x.sec===subject);
    pool.sort(()=>Math.random()-.5); questions=pool.slice(0,Math.min(count,pool.length));
    if(!questions.length){alert('No questions are available for this selection.');return}
    questions.forEach(x=>x.user=null);
    pos=0;remaining=time;marked={};examStart=Date.now();
    $('exam-launch').style.display='none';$('exam-running').style.display='';
    $('exam-title').textContent=label(subject==='all'?'All Subjects':subject)+' Mock Test';
    render();
    if(timer)clearInterval(timer);
    timer=setInterval(()=>{remaining--; $('exam-clock').textContent=fmt(remaining); if(remaining<=0){clearInterval(timer);timer=null;submit(true)}},1000);
  }
  function renderPalette(){
    $('exam-palette').innerHTML=questions.map((x,i)=>{
      const cls=(x.user? 'answered ':'unanswered ')+(marked[i]?'marked ':'')+(i===pos?'current':'');
      return '<button class="palette-btn '+cls+'" data-i="'+i+'">'+(i+1)+'</button>';
    }).join('');
    $('exam-palette').querySelectorAll('button').forEach(b=>b.onclick=()=>{pos=+b.dataset.i;render()});
  }
  function render(){
    const x=questions[pos], q=x.q;
    $('exam-clock').textContent=fmt(remaining);
    $('exam-counter').textContent='Question '+(pos+1)+' of '+questions.length;
    renderPalette();
    const letters=['A','B','C','D','E'].filter(l=>optText(q,l)!==l || q.options?.[l]);
    $('exam-question').innerHTML='<div class="exam-qmeta"><span class="exam-chip">'+esc2(label(x.sec))+'</span><span class="exam-chip">'+esc2(q.difficulty||q.level||'Moderate')+'</span></div><div class="q-card"><h3>'+esc2(q.question||q.q||'Question')+'</h3><div class="options">'+letters.map(l=>{
      const selected=x.user===l?' selected':'';
      return '<button class="option'+selected+'" data-letter="'+l+'"><b>'+l+'.</b> '+esc2(optText(q,l))+'</button>';
    }).join('')+'</div></div>';
    $('exam-question').querySelectorAll('.option').forEach(b=>b.onclick=()=>{x.user=b.dataset.letter;render()});
  }
  function score(){
    let correct=0,wrong=0,unanswered=0;
    const by={};
    questions.forEach(x=>{
      const sec=x.sec;by[sec]??={total:0,correct:0,wrong:0,unanswered:0};by[sec].total++;
      if(!x.user){unanswered++;by[sec].unanswered++}
      else if(x.user===getAnswer(x.q)){correct++;by[sec].correct++}
      else {wrong++;by[sec].wrong++}
    });
    const raw=correct-(wrong*neg);
    return {correct,wrong,unanswered,total:questions.length,raw,percentage:Math.max(0,raw/questions.length*100),by};
  }
  function submit(auto=false){
    if(timer){clearInterval(timer);timer=null}
    const r=score(), history=load(KEY,[]);
    const d=load(TARGET,{date:new Date().toISOString().slice(0,10),target:25,done:0});
    const today=new Date().toISOString().slice(0,10);
    if(d.date!==today){d.date=today;d.done=0}
    d.done=(d.done||0)+r.total-r.unanswered;save(TARGET,d);
    history.unshift({date:new Date().toISOString(),total:r.total,correct:r.correct,wrong:r.wrong,unanswered:r.unanswered,score:r.raw,percentage:r.percentage,negative:neg,by:r.by});
    save(KEY,history.slice(0,100));
    $('exam-running').style.display='none';$('exam-result').style.display='';
    renderResult(r,auto);
  }
  function renderResult(r,auto){
    const rows=Object.entries(r.by).sort((a,b)=>(b[1].wrong/b[1].total)-(a[1].wrong/a[1].total));
    const weak=rows.filter(([s,v])=>v.total&&v.correct/v.total<.6).slice(0,5);
    $('exam-result').innerHTML='<h2>Detailed Result</h2><div class="muted">'+(auto?'Time expired — test submitted automatically.':'Test submitted successfully.')+'</div>'+
      '<div class="result-grid"><div class="result-stat">Score<b>'+r.raw.toFixed(2)+'</b></div><div class="result-stat">Accuracy<b>'+r.percentage.toFixed(1)+'%</b></div><div class="result-stat">Correct<b>'+r.correct+'</b></div><div class="result-stat">Wrong<b>'+r.wrong+'</b></div><div class="result-stat">Unanswered<b>'+r.unanswered+'</b></div><div class="result-stat">Negative<b>'+(r.wrong*neg).toFixed(2)+'</b></div></div>'+
      '<h3>Subject-wise Performance</h3>'+rows.map(([s,v])=>'<div class="perf-row"><span>'+esc2(label(s))+'</span><div class="perf-bar"><div class="perf-fill" style="width:'+Math.round(v.correct/v.total*100)+'%"></div></div><b>'+v.correct+'/'+v.total+'</b></div>').join('')+
      '<h3>Weak Subjects / Topics</h3><div class="weak-list">'+(weak.length?weak.map(([s,v])=>'<div class="weak-item"><span>'+esc2(label(s))+'</span><b>'+Math.round(v.correct/v.total*100)+'%</b></div>').join(''):'<div class="muted">No major weak subject detected in this test.</div>')+'</div>'+
      '<div class="exam-actions" style="margin-top:16px"><button id="exam-new">New Mock Test</button><button id="exam-home">Close</button></div>';
    $('exam-new').onclick=openPanel;$('exam-home').onclick=closePanel;
  }
  $('open-exam-button').onclick=openPanel;
  $('exam-exit').onclick=closePanel;
  $('exam-start').onclick=start;
  $('exam-prev').onclick=()=>{if(pos>0){pos--;render()}};
  $('exam-next').onclick=()=>{if(pos<questions.length-1){pos++;render()}};
  $('exam-mark').onclick=()=>{marked[pos]=!marked[pos];render()};
  $('exam-clear').onclick=()=>{questions[pos].user=null;render()};
  $('exam-submit').onclick=()=>{if(confirm('Submit this mock test now?'))submit(false)};
  // Keep the panel accessible from existing single-page navigation if it uses global render().
  window.openSSCMockTest=openPanel;
})();
</script>


<script>
(function(){
  const oldOpen=window.openSSCMockTest;
  // Add exam history / weak-analysis card to the launch screen after the DOM settles.
  setTimeout(()=>{
    const launch=document.getElementById('exam-launch'); if(!launch)return;
    const box=document.createElement('div');box.id='exam-history-box';box.style.marginTop='14px';launch.appendChild(box);
    const hist=JSON.parse(localStorage.getItem('sscExamHistoryV1')||'[]');
    if(!hist.length){box.innerHTML='<div class="target-card"><b>Performance History</b><div class="muted">Complete a mock test to build your subject-wise and weak-area history.</div></div>';return}
    const avg=hist.reduce((a,x)=>a+(+x.percentage||0),0)/hist.length;
    const best=Math.max(...hist.map(x=>+x.percentage||0));
    box.innerHTML='<div class="target-card"><b>Performance History</b><div class="result-grid"><div class="result-stat">Tests<b>'+hist.length+'</b></div><div class="result-stat">Average<b>'+avg.toFixed(1)+'%</b></div><div class="result-stat">Best<b>'+best.toFixed(1)+'%</b></div></div></div>';
  },300);
})();
</script>
